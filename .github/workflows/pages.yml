name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Vérifie que les modules JavaScript se chargent (pas d'erreur de syntaxe ni d'import cassé).
      - name: Vérification des modules
        run: |
          for f in js/config.js js/propagation.js js/render.js js/profile.js; do
            node --input-type=module -e "await import('./$f')" && echo "ok $f"
          done
          for f in js/*.js; do
            node --input-type=module --check < "$f" && echo "syntaxe ok $f"
          done

      - name: Préparation du site
        run: |
          mkdir _site
          cp -r index.html css js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
